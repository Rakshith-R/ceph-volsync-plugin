---
name: Build and release versioned container images

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "v*"

jobs:
  tag_operator:
    name: Build and release the operator container image
    if: github.repository == 'ramendr/ceph-volsync-plugin'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Build and push operator container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Containerfile.manager
          platforms: ${{ vars.BUILD_PLATFORMS }}
          push: true
          tags: quay.io/ramendr/ceph-volsync-plugin-operator:${{ github.ref_name }}

  tag_mover:
    name: Build and release the mover container image
    if: github.repository == 'ramendr/ceph-volsync-plugin'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Load build configuration
        id: build_env
        run: |
          # shellcheck source=build/build.env
          source build/build.env
          echo "CEPH_BASE_IMAGE=${CEPH_BASE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "CEPH_VERSION=${CEPH_VERSION}" >> "$GITHUB_OUTPUT"
          echo "GOLANG_VERSION=${GOLANG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "RSYNC_VERSION=${RSYNC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "STUNNEL_VERSION=${STUNNEL_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push mover container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Containerfile.mover
          platforms: ${{ vars.BUILD_PLATFORMS }}
          push: true
          tags: quay.io/ramendr/ceph-volsync-plugin-mover:${{ github.ref_name }}
          build-args: |
            CEPH_BASE_IMAGE=${{ steps.build_env.outputs.CEPH_BASE_IMAGE }}
            CEPH_VERSION=${{ steps.build_env.outputs.CEPH_VERSION }}
            GOLANG_VERSION=${{ steps.build_env.outputs.GOLANG_VERSION }}
            RSYNC_VERSION=${{ steps.build_env.outputs.RSYNC_VERSION }}
            STUNNEL_VERSION=${{ steps.build_env.outputs.STUNNEL_VERSION }}

  tag_bundle:
    name: Build and release the bundle container image
    if: github.repository == 'ramendr/ceph-volsync-plugin'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Generate the bundle contents
        run: make bundle VERSION=${{ steps.version.outputs.version }}

      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Build and push bundle container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bundle.Dockerfile
          push: true
          tags: quay.io/ramendr/ceph-volsync-plugin-operator-bundle:${{ github.ref_name }}

  publish_release:
    name: Publish release with install artifacts
    if: github.repository == 'ramendr/ceph-volsync-plugin'
    needs:
      - tag_operator
      - tag_mover
      - tag_bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Generate install manifest
        run: >
          make build-installer
          VERSION=${{ steps.version.outputs.version }}
          IMG=quay.io/ramendr/ceph-volsync-plugin-operator:${{ github.ref_name }}
          MOVER_IMG=quay.io/ramendr/ceph-volsync-plugin-mover:${{ github.ref_name }}

      - name: Publish the release and attach install manifest
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "dist/install.yaml"
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
