apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-manager
  namespace: system
  labels:
    app.kubernetes.io/name: ceph-volsync-plugin-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: ceph-volsync-plugin-operator
  # Ingress is listed in `policyTypes` with no rules, so all inbound traffic is denied.
  egress:
  - {}
  policyTypes:
  - Ingress
  - Egress
